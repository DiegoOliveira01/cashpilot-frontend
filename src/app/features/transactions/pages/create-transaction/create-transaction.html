<div class="min-h-screen bg-gray-950 p-6">
  <div class="max-w-lg mx-auto">

    <!-- Header -->
    <div class="flex items-center gap-4 mb-8">
      <button routerLink="/dashboard" class="text-gray-400 hover:text-white p-2.5 rounded-lg hover:bg-gray-800 active:scale-90 transition flex items-center justify-center gap-1 group">
        <svg class="w-5 h-5 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span class="text-sm font-medium pr-1">Voltar</span>
      </button>
      
      <div>
        <h1 class="text-2xl font-bold text-white">Nova Transação</h1>
        <p class="text-gray-400 text-sm mt-1">Adicione uma nova receita ou despesa</p>
      </div>
    </div>

    <!-- Card do formulário -->
    <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800">
      <form (ngSubmit)="submit()">

        <!-- Descrição -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Descrição
          </label>
          <input
            [(ngModel)]="form.description"
            name="description"
            required
            placeholder="Ex: Salário, Aluguel, Mercado..."
            class="w-full bg-gray-800 text-white placeholder-gray-500 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <!-- Valor -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Valor
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm">R$</span>
            <input
              type="number"
              [(ngModel)]="form.amount"
              name="amount"
              required
              placeholder="0,00"
              class="w-full bg-gray-800 text-white placeholder-gray-500 border border-gray-700 rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
          </div>
        </div>

        <!-- Tipo -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Tipo
          </label>
          <div class="grid grid-cols-2 gap-3">
            <button
              type="button"
              (click)="setType('INCOME')"
              class="py-2.5 rounded-lg text-sm font-semibold border transition cursor-pointer"
              [class.bg-green-500]="form.type === 'INCOME'"
              [class.text-white]="form.type === 'INCOME'"
              [class.border-green-500]="form.type === 'INCOME'"
              [class.bg-gray-800]="form.type !== 'INCOME'"
              [class.text-gray-400]="form.type !== 'INCOME'"
              [class.border-gray-700]="form.type !== 'INCOME'"
            >
              + Receita
            </button>
            <button
              type="button"
              (click)="setType('EXPENSE')"
              class="py-2.5 rounded-lg text-sm font-semibold border transition cursor-pointer"
              [class.bg-red-500]="form.type === 'EXPENSE'"
              [class.text-white]="form.type === 'EXPENSE'"
              [class.border-red-500]="form.type === 'EXPENSE'"
              [class.bg-gray-800]="form.type !== 'EXPENSE'"
              [class.text-gray-400]="form.type !== 'EXPENSE'"
              [class.border-gray-700]="form.type !== 'EXPENSE'"
            >
              - Despesa
            </button>
          </div>
        </div>

        <!-- Categoria (Grid Selecionável) -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-300 mb-2">
            Categoria
          </label>
          
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <!-- Opção: Sem categoria -->
            <button
              type="button"
              (click)="form.categoryId = null"
              class="flex items-center gap-2 p-2.5 rounded-lg border transition text-left"
              [class.bg-indigo-600]="form.categoryId === null"
              [class.text-white]="form.categoryId === null"
              [class.border-indigo-500]="form.categoryId === null"
              [class.bg-gray-800]="form.categoryId !== null"
              [class.text-gray-400]="form.categoryId !== null"
              [class.border-gray-700]="form.categoryId !== null"
            >
              <div class="w-6 h-6 rounded-md bg-black/20 flex items-center justify-center shrink-0">
                <app-icon name="lucideTag" class="w-3.5 h-3.5" />
              </div>
              <span class="text-xs font-medium truncate">Sem categoria</span>
            </button>

            <!-- Opções de Categorias -->
            @for (c of availableCategories; track c.id) {
              <button
                type="button"
                (click)="form.categoryId = c.id"
                class="flex items-center gap-2 p-2.5 rounded-lg border transition text-left"
                [class.bg-indigo-600]="form.categoryId === c.id"
                [class.text-white]="form.categoryId === c.id"
                [class.border-indigo-500]="form.categoryId === c.id"
                [class.bg-gray-800]="form.categoryId !== c.id"
                [class.text-gray-400]="form.categoryId !== c.id"
                [class.border-gray-700]="form.categoryId !== c.id"
              >
                <div class="w-6 h-6 rounded-md bg-black/20 flex items-center justify-center shrink-0">
                  @if (c.icon?.startsWith('lucide')) {
                    <app-icon [name]="c.icon!" class="w-3.5 h-3.5" />
                  } @else if (c.icon) {
                    <span class="text-sm">{{ c.icon }}</span>
                  } @else {
                    <app-icon name="lucideTag" class="w-3.5 h-3.5" />
                  }
                </div>
                <span class="text-xs font-medium truncate">{{ c.name }}</span>
              </button>
            }
          </div>
          
          <div class="mt-2 text-right">
            <a routerLink="/categories" class="text-xs text-gray-500 hover:text-indigo-400 transition inline-block">
              Gerenciar categorias →
            </a>
          </div>
        </div>

        <!-- Toggle de Recorrência -->
        <div class="mb-6 p-4 bg-gray-800/50 border border-gray-700 rounded-xl">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-medium text-white">Conta recorrente</p>
              <p class="text-xs text-gray-400">Repetir esta transação automaticamente</p>
            </div>
            <button
              type="button"
              (click)="toggleRecurrence()"
              [class.bg-indigo-600]="form.isRecurring"
              [class.bg-gray-700]="!form.isRecurring"
              class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors cursor-pointer"
            >
              <span
                [class.translate-x-6]="form.isRecurring"
                class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
              ></span>
            </button>
          </div>

          <!-- Configurações de Recorrência -->
          @if (form.isRecurring) {
            <div class="mt-4 grid grid-cols-2 gap-3 border-t border-gray-700 pt-4">
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-xs text-gray-400 mb-1">Frequência</label>
                <select
                  [(ngModel)]="form.frequency"
                  name="frequency"
                  class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500"
                >
                  <option value="WEEKLY">Semanal</option>
                  <option value="MONTHLY">Mensal</option>
                  <option value="TWICE_MONTHLY">Duas vezes no mês</option>
                </select>
              </div>

              @if (form.frequency === 'MONTHLY') {
                <div class="col-span-2 sm:col-span-1">
                  <label class="block text-xs text-gray-400 mb-1">Dia do mês</label>
                  <input type="number" min="1" max="31" [(ngModel)]="form.firstDayOfMonth" name="firstDay" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
              }

              @if (form.frequency === 'TWICE_MONTHLY') {
                <div class="col-span-2 flex gap-2">
                  <div class="flex-1">
                    <label class="block text-xs text-gray-400 mb-1">1º Dia</label>
                    <input type="number" min="1" max="31" [(ngModel)]="form.firstDayOfMonth" name="firstDay" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" />
                  </div>
                  <div class="flex-1">
                    <label class="block text-xs text-gray-400 mb-1">2º Dia</label>
                    <input type="number" min="1" max="31" [(ngModel)]="form.secondDayOfMonth" name="secondDay" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" />
                  </div>
                </div>
              }

              <div class="col-span-2 flex gap-3 mt-2">
                <div class="flex-1">
                  <label class="block text-xs text-gray-400 mb-1">Data final (Opcional)</label>
                  <input type="date" [(ngModel)]="form.endDate" name="endDate" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
                <div class="flex-1">
                  <label class="block text-xs text-gray-400 mb-1">Máx. repetições (Opcional)</label>
                  <input type="number" min="1" placeholder="Ex: 12" [(ngModel)]="form.maxOccurrences" name="maxOccurrences" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" />
                </div>
              </div>
            </div>
          }
        </div>

        <!-- Data -->
        <div class="mb-8">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Data
          </label>
          <input
            type="date"
            [(ngModel)]="form.date"
            name="date"
            required
            class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <!-- Botão -->
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition duration-200 cursor-pointer"
        >
          Salvar Transação
        </button>

      </form>
    </div>
  </div>
</div>
