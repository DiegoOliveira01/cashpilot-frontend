<div class="min-h-screen bg-gray-950 p-6">
  <div class="max-w-lg mx-auto">

    <!-- Header -->
    <div class="flex items-center gap-4 mb-8">
      <!-- Novo Botão Voltar -->
      <button routerLink="/dashboard" class="text-gray-400 hover:text-white p-2.5 rounded-lg hover:bg-gray-800 active:scale-90 transition flex items-center justify-center gap-1 group">
        <svg class="w-5 h-5 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span class="text-sm font-medium pr-1">Voltar</span>
      </button>

      <div>
        <h1 class="text-2xl font-bold text-white">Editar Transação</h1>
        <p class="text-gray-400 text-sm mt-1">Atualize os dados da transação</p>
      </div>
    </div>

    <!-- Card do formulário -->
    <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800">
      <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- Descrição -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Descrição
          </label>
          <input
            formControlName="description"
            placeholder="Ex: Salário, Aluguel, Mercado..."
            class="w-full bg-gray-800 text-white placeholder-gray-500 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <!-- Valor -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Valor
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm">R$</span>
            <input
              type="number"
              formControlName="amount"
              placeholder="0,00"
              class="w-full bg-gray-800 text-white placeholder-gray-500 border border-gray-700 rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
          </div>
        </div>

        <!-- Tipo -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Tipo
          </label>
          <div class="grid grid-cols-2 gap-3">
            <button
              type="button"
              (click)="setType('INCOME')"
              class="py-2.5 rounded-lg text-sm font-semibold border transition cursor-pointer"
              [class.bg-green-500]="form.get('type')?.value === 'INCOME'"
              [class.text-white]="form.get('type')?.value === 'INCOME'"
              [class.border-green-500]="form.get('type')?.value === 'INCOME'"
              [class.bg-gray-800]="form.get('type')?.value !== 'INCOME'"
              [class.text-gray-400]="form.get('type')?.value !== 'INCOME'"
              [class.border-gray-700]="form.get('type')?.value !== 'INCOME'"
            >
              + Receita
            </button>
            <button
              type="button"
              (click)="setType('EXPENSE')"
              class="py-2.5 rounded-lg text-sm font-semibold border transition cursor-pointer"
              [class.bg-red-500]="form.get('type')?.value === 'EXPENSE'"
              [class.text-white]="form.get('type')?.value === 'EXPENSE'"
              [class.border-red-500]="form.get('type')?.value === 'EXPENSE'"
              [class.bg-gray-800]="form.get('type')?.value !== 'EXPENSE'"
              [class.text-gray-400]="form.get('type')?.value !== 'EXPENSE'"
              [class.border-gray-700]="form.get('type')?.value !== 'EXPENSE'"
            >
              - Despesa
            </button>
          </div>
        </div>

        <!-- Categoria (Novo Grid Selecionável) -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-300 mb-2">
            Categoria
          </label>
          
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <!-- Opção: Sem categoria -->
            <button
              type="button"
              (click)="form.get('categoryId')?.setValue(null)"
              class="flex items-center gap-2 p-2.5 rounded-lg border transition text-left"
              [class.bg-indigo-600]="form.get('categoryId')?.value === null"
              [class.text-white]="form.get('categoryId')?.value === null"
              [class.border-indigo-500]="form.get('categoryId')?.value === null"
              [class.bg-gray-800]="form.get('categoryId')?.value !== null"
              [class.text-gray-400]="form.get('categoryId')?.value !== null"
              [class.border-gray-700]="form.get('categoryId')?.value !== null"
            >
              <div class="w-6 h-6 rounded-md bg-black/20 flex items-center justify-center shrink-0">
                <app-icon name="lucideTag" class="w-3.5 h-3.5" />
              </div>
              <span class="text-xs font-medium truncate">Sem categoria</span>
            </button>

            <!-- Opções de Categorias -->
            @for (c of availableCategories; track c.id) {
              <button
                type="button"
                (click)="form.get('categoryId')?.setValue(c.id)"
                class="flex items-center gap-2 p-2.5 rounded-lg border transition text-left"
                [class.bg-indigo-600]="form.get('categoryId')?.value === c.id"
                [class.text-white]="form.get('categoryId')?.value === c.id"
                [class.border-indigo-500]="form.get('categoryId')?.value === c.id"
                [class.bg-gray-800]="form.get('categoryId')?.value !== c.id"
                [class.text-gray-400]="form.get('categoryId')?.value !== c.id"
                [class.border-gray-700]="form.get('categoryId')?.value !== c.id"
              >
                <div class="w-6 h-6 rounded-md bg-black/20 flex items-center justify-center shrink-0">
                  @if (c.icon?.startsWith('lucide')) {
                    <app-icon [name]="c.icon!" class="w-3.5 h-3.5" />
                  } @else if (c.icon) {
                    <span class="text-sm">{{ c.icon }}</span>
                  } @else {
                    <app-icon name="lucideTag" class="w-3.5 h-3.5" />
                  }
                </div>
                <span class="text-xs font-medium truncate">{{ c.name }}</span>
              </button>
            }
          </div>
          
          <div class="mt-2 text-right">
            <a routerLink="/categories" class="text-xs text-gray-500 hover:text-indigo-400 transition inline-block">
              Gerenciar categorias →
            </a>
          </div>
        </div>

        <!-- Data -->
        <div class="mb-8">
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Data
          </label>
          <input
            type="date"
            formControlName="date"
            class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <!-- Botões -->
        <div class="flex gap-3">
          <button
            type="button"
            routerLink="/dashboard"
            class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="form.invalid"
            class="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer"
          >
            Atualizar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
