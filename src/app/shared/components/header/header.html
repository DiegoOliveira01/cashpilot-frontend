<nav class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-6 py-3 transition-all">
  <div class="max-w-4xl mx-auto flex items-center justify-between">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <!-- Adicionado um efeito sutil de escala na logo ao passar o mouse -->
      <img src="logo.png" alt="Cash Pilot" class="w-10 h-10 object-contain group-hover:scale-105 transition-transform" />
      <!-- Esconde o texto em telas muito pequenas -->
      <span class="hidden sm:block text-white font-bold text-lg tracking-tight group-hover:text-gray-200 transition-colors">
        Cash Pilot
      </span>
    </a>

    <!-- Navegação -->
    <div class="flex items-center gap-2 sm:gap-4">

      <!-- NÃO LOGADO -->
      @if (!authService.isLogged()) {
        <a
          routerLink="/login"
          class="text-sm text-gray-400 hover:text-white font-medium px-4 py-2 rounded-lg hover:bg-gray-800 transition-colors"
        >
          Login
        </a>
      }

      <!-- LOGADO -->
      @if (authService.isLogged()) {
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-gray-800 text-white"
          class="text-sm text-gray-400 hover:text-white font-medium px-4 py-2 rounded-lg hover:bg-gray-800 transition-colors"
        >
          Dashboard
        </a>

        <div class="w-px h-4 bg-gray-700 mx-1"></div> <!-- Divisor vertical sutil -->

        <button
          (click)="logout()"
          class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-lg font-medium transition-colors cursor-pointer group"
        >
          <span>Sair</span>
          <!-- Ícone de logout -->
          <svg class="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      }

    </div>
  </div>
</nav>
